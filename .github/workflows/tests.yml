name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install . pytest
      - run: python -c "import tasksource; tasksource.list_tasks(); tasksource.list_tasks(multilingual=True)"
      - run: python -m pytest -q tests
