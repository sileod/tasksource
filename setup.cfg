[metadata]
name = tasksource
description = Standardized decision tasks (classification, multiple choice, token labeling) for multi-task training and evaluation
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/sileod/tasksource/
license = BSD-3-Clause
license_files =
    LICENSE
    LICENSE-CC-BY-4.0
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: BSD License
    Intended Audience :: Developers

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    dotwiz
    funcy
    datasets
    Pillow
    exrex
    ftfy
    magicattr
    pandas
    numpy
    scipy
    sorcery
    langcodes[data]

[options.package_data]
tasksource =
    metadata/*.txt
    task_discovery/*.md
    task_discovery/*.json
    task_discovery/*.jsonl
    jev/task_prompts.json
    jev/synthetic/prompts/*.txt
    jev/synthetic/configs/*.yaml
    jev/synthetic/samples/*
    jev/synthetic_extraction/prompts/*.txt

[options.packages.find]
where = src
