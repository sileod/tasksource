# Albert / deepseek-v4-flash-0731 generator (initial).
run_name: deepseek_v4_flash_v1
output_dir: .synthetic_runs

provider:
  name: albert
  api_key_env: ALBERT_API_KEY
  base_url: https://albert.api.etalab.gouv.fr/v1
  model: deepseek-v4-flash-0731

generation:
  temperature: 0.8
  concurrency: 10
  max_output_tokens: 4000
  seed: 42
  prompt_version: generate_v1
  n_states: 1000

sampler:
  seed: 42
  n_states: 1000
  questions_per_state: {"1": 0.60, "2": 0.25, "3": 0.10, "4": 0.05}
  question_formats: {"choice": 0.40, "noul": 0.30, "score": 0.30}
  probability_mixed_formats: 0.85
  probability_all_formats_if_n_ge_3: 0.70

critic:
  enabled: true
  provider: albert
  model: deepseek-v4-flash-0731
  prompt_version: critic_v1
  temperature: 0.0

annotator:
  name: jev
  version: jev-1.0
  base_url: ""
  api_key_env: JEV_API_KEY
  model: jev-1

selection:
  buckets: {"very_confident": 0.20, "confident": 0.30, "moderately_ambiguous": 0.30,
            "high_ambiguity": 0.15, "near_uniform": 0.05}

split:
  train: 0.85
  validation: 0.075
  test: 0.075
  ood_fraction: 0.05
  seed_salt: jev-synthetic-split-v1
