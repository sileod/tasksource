# DeepSeek generation + independent OpenAI-model teacher audit + pinned Jev targets.
# This is intentionally more expensive than the overnight baseline. The auditor
# never sees Jev's probabilities; it independently answers each question and only
# flags high-confidence disagreements.
run_name: deepseek_v4_flash_jev_audited
output_dir: .synthetic_runs

provider:
  name: albert
  api_key_env: ALBERT_API_KEY
  optional_api_key_envs: [ALBERT_API_KEY_2]
  base_url: https://albert.api.etalab.gouv.fr/v1
  model: deepseek-v4-flash-0731

generation:
  temperature: 0.8
  concurrency: 20
  max_output_tokens: 4000
  seed: 42
  prompt_version: generate_v2
  n_states: 4000

sampler:
  seed: 42
  n_states: 4000
  questions_per_state: {'1': 0.65, '2': 0.25, '3': 0.07, '4': 0.03}
  question_formats: {choice: 0.5, noul: 0.4, score: 0.1}
  probability_mixed_formats: 0.85
  probability_all_formats_if_n_ge_3: 0.3
  # Favor clear cases while retaining hard, ambiguous, and noisy examples.
  difficulty_weights: {'1': 0.30, '2': 0.25, '3': 0.20, '4': 0.15, '5': 0.10}
  ambiguity_weights: {minimal: 0.30, low: 0.25, moderate: 0.20, high: 0.15, extreme: 0.10}
  distractor_weights: {'0': 0.35, '1': 0.30, '2': 0.20, '3': 0.15}

critic:
  enabled: true
  provider:
    name: albert
    api_key_env: ALBERT_API_KEY
    optional_api_key_envs: [ALBERT_API_KEY_2]
    base_url: https://albert.api.etalab.gouv.fr/v1
    model: deepseek-v4-flash-0731
  model: deepseek-v4-flash-0731
  prompt_version: critic_v1
  temperature: 0.0
  requests_per_minute: 40

annotator:
  name: jev
  version: jev-1.13
  base_url: https://openrouter.ai
  api_path: /api/alpha/decisions
  api_key_env: OPENROUTER_API_KEY
  model: typesafe/jev-1.13

teacher_audit:
  enabled: true
  provider:
    name: openrouter
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4.1-mini
  model: openai/gpt-4.1-mini
  prompt_version: teacher_audit_v1
  temperature: 0.0
  requests_per_minute: 40
  min_teacher_confidence: 0.85
  min_auditor_confidence: 0.80
  # Keep flagged rows in the public artifact by default so filtering choices are
  # auditable. Set true for a clean training-only subset.
  drop_confident_disagreements: false

selection:
  buckets:
    very_confident: 0.2
    confident: 0.3
    moderately_ambiguous: 0.3
    high_ambiguity: 0.15
    near_uniform: 0.05
  # When --n-target downsamples, reserve this fraction without consulting Jev
  # confidence, then fill the rest with the requested ambiguity mixture.
  unfiltered_fraction: 0.20
  seed_salt: jev-synthetic-selection-v2

split:
  train: 0.85
  validation: 0.075
  test: 0.075
  ood_fraction: 0.05
  seed_salt: jev-synthetic-split-v1
